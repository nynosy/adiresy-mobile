[versions]
agp              = "9.5.0"
desugar          = "2.1.5"

# Code quality
errorprone             = "2.51.0"
errorproneGradlePlugin = "5.1.1"

# UI
appcompat        = "1.8.0"
material         = "1.14.0"
activity         = "1.13.0"
fragment         = "1.9.1"

# Map — verify latest stable at build time
maplibre         = "13.7.1"

# Architecture
lifecycle        = "2.11.0"

# Network
retrofit         = "3.0.0"
# 5.5.0+ requires compileSdk 37, which doesn't exist in the public SDK repo
# yet (only up to 36.1) — 5.4.0 is the newest release that still only needs
# compileSdk 36. Revisit once compileSdk is raised.
okhttp           = "5.4.0"

# Local data
room             = "2.8.5"

# Background work
work             = "2.12.0"

# QR code generation
zxing            = "3.5.4"

# Test
junit            = "4.13.2"
junitVersion     = "1.3.0"
espressoCore     = "3.7.0"

[libraries]
# Desugaring
desugar-jdk-libs         = { group = "com.android.tools",              name = "desugar_jdk_libs",        version.ref = "desugar" }

# UI
appcompat                = { group = "androidx.appcompat",              name = "appcompat",               version.ref = "appcompat" }
material                 = { group = "com.google.android.material",     name = "material",                version.ref = "material" }
activity                 = { group = "androidx.activity",               name = "activity",                version.ref = "activity" }
fragment                 = { group = "androidx.fragment",               name = "fragment",                version.ref = "fragment" }

# Map
maplibre                 = { group = "org.maplibre.gl",                 name = "android-sdk",             version.ref = "maplibre" }

# Architecture
lifecycle-viewmodel      = { group = "androidx.lifecycle",              name = "lifecycle-viewmodel",     version.ref = "lifecycle" }
lifecycle-livedata       = { group = "androidx.lifecycle",              name = "lifecycle-livedata",      version.ref = "lifecycle" }

# Network
retrofit                 = { group = "com.squareup.retrofit2",          name = "retrofit",                version.ref = "retrofit" }
retrofit-converter-gson  = { group = "com.squareup.retrofit2",          name = "converter-gson",          version.ref = "retrofit" }
okhttp                   = { group = "com.squareup.okhttp3",            name = "okhttp",                  version.ref = "okhttp" }
okhttp-logging           = { group = "com.squareup.okhttp3",            name = "logging-interceptor",     version.ref = "okhttp" }

# Local data
room-runtime             = { group = "androidx.room",                   name = "room-runtime",            version.ref = "room" }
room-compiler            = { group = "androidx.room",                   name = "room-compiler",           version.ref = "room" }

# Background work
work-runtime             = { group = "androidx.work",                   name = "work-runtime",            version.ref = "work" }

# QR code generation
zxing-core               = { group = "com.google.zxing",                name = "core",                    version.ref = "zxing" }

# Test
junit                    = { group = "junit",                           name = "junit",                   version.ref = "junit" }
ext-junit                = { group = "androidx.test.ext",               name = "junit",                   version.ref = "junitVersion" }
espresso-core            = { group = "androidx.test.espresso",          name = "espresso-core",           version.ref = "espressoCore" }

# Code quality
errorprone-core          = { group = "com.google.errorprone",           name = "error_prone_core",        version.ref = "errorprone" }

[plugins]
android-application      = { id = "com.android.application",           version.ref = "agp" }
errorprone                = { id = "net.ltgt.errorprone",               version.ref = "errorproneGradlePlugin" }
